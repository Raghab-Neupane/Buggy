version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: buggy_db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: buggy
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
